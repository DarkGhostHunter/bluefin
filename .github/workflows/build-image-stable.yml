name: Stable Images
on:
  merge_group: # Make Stable-Daily run on merge groups
  pull_request:
    branches:
      - main
      - testing
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
      - "system_files/shared/etc/bazaar/**"
  schedule:
    - cron: "0 1 * * TUE" # Every Tuesday at 1:00 AM UTC (same as bluefin-lts)
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-image-stable:
    name: Build Stable Images
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        brand_name: ["bluefin"]
    with:
      # Fork: stable is pinned to pair with the akmods-nvidia-lts (NVIDIA 580.x LTS
      # driver) and akmods main-45 artifacts. Before bumping, confirm the matching
      # ghcr.io tags akmods:main-45-<kernel> and akmods-nvidia-lts:main-45-<kernel> exist.
      # The pin must be the full `uname -r` release (with arch suffix, as in the
      # akmods image ostree.linux label) because it becomes the ostree.linux label
      # and the /usr/lib/modules/<release> path used by the secureboot check.
      kernel_pin: 7.3.3-300.fc45.x86_64
      image_flavors: '["main", "nvidia-lts"]'
      brand_name: ${{ matrix.brand_name }}
      stream_name: stable

  generate-release:
    name: Generate Release
    needs: [build-image-stable]
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["stable", "stable-daily"]'
